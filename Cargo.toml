[package]
name = "aiurgaze"
version = "0.2.0"
edition = "2021"

include = [
    "assets/units/*.png",
    "assets/units/*.webp",
    "maps/*.sc2map",
    "config.toml",
    "config/**",
    "data/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
]

[dependencies]
# --- Runtime / async / gRPC ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
bytes = "1"
log = "0.4"

# --- Rendering / UI ---
bevy = { version = "0.17.3", features = ["default", "webp"]}
bevy_egui = "0.38.0"
bevy_ecs_tilemap = "0.17.0"
bevy-tokio-tasks = "0.17.0"

#bevy_health_bar3d = "*"
bevy_health_bar3d = { version = "3.7.0", default-features = false, features = ["2d"] }

tiled = { version = "0.15.0", default-features = false }

sc2-proto = { git = "https://github.com/kubivan/sc2-proto-rs.git", branch = "master" }

#-- ecs tiled map
serde_json = "*"
ldtk_rust ="*"

# --- Concurrency / Utils ---
thiserror = "2.0.17"
tokio-tungstenite = "0.28.0"
tungstenite = "0.28.0"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"

protobuf = "2.17.0"
futures-util = "0.3.31"
config = "0.15"
serde = "1.0.228"
toml = "0.9.8"
directories = "5"

[build-dependencies]
tiled = { version = "0.15.0", default-features = false }

[features]
# Build with `--features use-wasm-view` if ever embedding to a webview later
use-wasm-view = []
