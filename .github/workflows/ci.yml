---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev \
            libgl1-mesa-dev

      - name: Check formatting
        run: cargo fmt -- --check

#     - name: Clippy lints
#       run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Build Release
        run: cargo build --release --verbose
